<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The base href must stay: flutter build rewrites it from --base-href. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dry Run is a practice drill for digital arrest scam calls. It does not measure risk or prevent fraud.">
  <meta name="theme-color" content="rgb(20 22 26)">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dry Run">
  <meta property="og:title" content="Dry Run">
  <meta property="og:description" content="A calm practice drill for spotting a digital arrest scam call. Practice, not protection.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Dry Run">
  <meta name="twitter:description" content="A calm practice drill for spotting a digital arrest scam call. Practice, not protection.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dry Run">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Dry Run</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: rgb(20 22 26);
      color: rgb(245 246 247);
      font-family: sans-serif;
    }
    #dr-loading {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #dr-loading .dr-sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 360px;
      text-align: center;
    }
    #dr-loading .dr-mark {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: rgb(20 22 26);
      border: 2px solid rgb(56 62 70);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #dr-loading .dr-name {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0;
    }
    #dr-loading .dr-line {
      font-size: 0.875rem;
      line-height: 1.5;
      color: rgb(168 176 186);
    }
    #dr-loading .dr-bar {
      width: 160px;
      height: 4px;
      border-radius: 9999px;
      background: rgb(44 50 58);
      overflow: hidden;
    }
    #dr-loading .dr-bar span {
      display: block;
      width: 48px;
      height: 4px;
      border-radius: 9999px;
      background: rgb(47 143 138);
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background: rgb(250 249 247);
        color: rgb(24 26 30);
      }
      #dr-loading .dr-mark {
        background: rgb(255 255 255);
        border-color: rgb(214 210 204);
      }
      #dr-loading .dr-line {
        color: rgb(94 100 110);
      }
      #dr-loading .dr-bar {
        background: rgb(232 229 224);
      }
    }
  </style>
</head>
<body>
  <div id="dr-loading" role="status" aria-live="polite" aria-label="Loading the practice drill">
    <div class="dr-sheet">
      <div class="dr-mark" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 5a17 17 0 1 1-16 11" stroke="rgb(47 143 138)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="22" cy="22" r="3" fill="rgb(245 246 247)"/>
        </svg>
      </div>
      <div class="dr-name">Dry Run</div>
      <div class="dr-line">Practice, not protection</div>
      <div class="dr-bar" aria-hidden="true"><span></span></div>
      <div class="dr-line">Loading the practice drill</div>
    </div>
  </div>

  <!-- Removes the branded shell after the first Flutter frame. External so the
       CSP can stay script-src 'self' with no inline exception. -->
  <script src="loader.js"></script>
  <!-- flutter_bootstrap.js is generated by the Flutter tool at build time. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
