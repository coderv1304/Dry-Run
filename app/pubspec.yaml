name: dryrun
description: "Dry Run: a practice drill for digital arrest scam calls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  api_client:
    path: ../packages/api_client
  flutter_riverpod: ^2.4.9
  riverpod: ^2.4.9
  go_router: ^12.1.3
  dio: ^5.4.0
  share_plus: ^7.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: any
  uuid: ^4.5.1
  web: ^1.1.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "web/icons/Icon-512.png"
  adaptive_icon_background: "#14161A"
  adaptive_icon_foreground: "web/icons/Icon-512.png"

flutter:
  uses-material-design: false
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf