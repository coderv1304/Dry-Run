name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dryrun
          POSTGRES_PASSWORD: dryrun_password
          POSTGRES_DB: dryrun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install api_client Dart dependencies
        run: |
          cd packages/api_client
          dart pub get

      - name: Run CI
        env:
          DATABASE_URL: postgresql://dryrun:dryrun_password@localhost:5432/dryrun_test
        run: make ci

  design-system:
    # Goldens are rasterised per platform, so the design gate runs on the same
    # image the baselines were generated on. Regenerate with: make goldens
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Python tooling dependencies
        run: pip install pyyaml

      - name: Run the design lint and token checks
        run: make lint-ui

      - name: Analyse the app
        run: |
          cd app
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Run component and gallery goldens
        run: |
          cd app
          flutter test
