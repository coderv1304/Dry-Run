[project]
name = "dryrun-backend"
version = "0.1.0"
description = "FastAPI backend service for Dry Run scam drill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests", "alembic"]

