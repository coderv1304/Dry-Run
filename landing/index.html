<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dry Run - Digital Arrest Scam Practice Drill</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <aside class="disclaimer-banner" id="disclaimer-banner"></aside>

    <header>
      <h1 id="hero-headline"></h1>
      <p class="lead" id="hero-subheadline"></p>
      <div class="cta-group">
        <button class="btn btn-primary" id="btn-try"></button>
        <button class="btn btn-secondary" id="btn-invite"></button>
      </div>
    </header>

    <main>
      <section>
        <h2 id="facts-headline"></h2>
        <div class="fact-box">
          <span class="stat-number" id="stat-value"></span>
          <p id="stat-label"></p>
        </div>
      </section>

      <section>
        <h2 id="how-headline"></h2>
        <div class="vertical-list" id="how-steps"></div>
      </section>

      <section>
        <h2 id="habits-headline"></h2>
        <div class="vertical-list" id="habits-items"></div>
      </section>
    </main>

    <footer>
      <p id="footer-notice"></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
